name: Build LiteWire APK

on:
  push:
    branches: [main, master]
    paths: ['android-project/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON secret. Add your Firebase google-services.json content in GitHub Repo -> Settings -> Secrets and variables -> Actions -> GOOGLE_SERVICES_JSON."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android-project/app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litewire-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
