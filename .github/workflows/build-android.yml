name: Build LiteWire APK
on:
  push:
    branches: [main]
    paths: ['android-project/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write google-services.json from secret
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "Missing repository secret GOOGLE_SERVICES_JSON (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$GSJ" > android-project/app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android-project
      - uses: actions/upload-artifact@v4
        with:
          name: litewire-debug
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
